{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/stock.css' %}">
{% endblock %}

{% block content %}
<div class="stock-form-page">
    <div class="stock-form-card sortie-card">
        <a href="{% url 'stock:operation_list' %}" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Retour aux operations
        </a>

        <h1>Nouvelle sortie</h1>

        {% if error %}
            <div class="error-box">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label>Client</label>
            <select name="client" required>
                <option value="">Selectionner un client</option>
                {% for client in clients %}
                    <option value="{{ client.id }}" {% if selected_client == client.id|stringformat:"s" %}selected{% endif %}>{{ client.nom }}</option>
                {% endfor %}
            </select>

            <label>Produit</label>
            <select name="produit" required>
                <option value="">Selectionner un produit</option>
                {% for produit in produits %}
                    <option value="{{ produit.id }}" {% if selected_produit == produit.id|stringformat:"s" %}selected{% endif %}>
                        {{ produit.nom }} - stock: {{ produit.quantite_stock }}
                    </option>
                {% endfor %}
            </select>

            <label>Quantite</label>
            <input type="number" name="quantite" min="1" value="{{ quantite|default:'' }}" required>

            <div class="stock-form-actions">
                <a href="{% url 'stock:operation_list' %}">
                    <i class="fa-solid fa-arrow-left"></i> Annuler
                </a>
                <button type="submit" class="btn-sortie">Creer la sortie</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
