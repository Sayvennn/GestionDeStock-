{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/catalogue.css' %}">
{% endblock %}

{% block content %}
<div class="catalogue-form-card glass-card fade-in">
    <a href="{% url 'catalogue:categorie_list' %}" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Retour aux categories
    </a>

    <h1>
        {% if categorie %}Modifier Categorie{% else %}Nouvelle Categorie{% endif %}
    </h1>

    {% if error %}
        <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="catalogue-input-group">
            <label>Nom de la categorie</label>
            <input type="text" name="nom" value="{{ categorie.nom|default:'' }}" required>
        </div>

        <div class="catalogue-input-group">
            <label>Description</label>
            <textarea name="description" rows="4">{{ categorie.description|default:'' }}</textarea>
        </div>

        <div class="catalogue-actions">
            <button type="submit">Enregistrer</button>
            <a href="{% url 'catalogue:categorie_list' %}">
                <i class="fa-solid fa-arrow-left"></i> Annuler
            </a>
        </div>
    </form>
</div>
{% endblock %}
